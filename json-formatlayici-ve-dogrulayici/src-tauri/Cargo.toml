[package]
name = "json-formatlayici"
version = "1.3.0"
description = "JSON Formatlayıcı ve Doğrulayıcı masaüstü"
authors = ["you"]
edition = "2021"

[lib]
name = "json_formatlayici_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
notify = "6.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
