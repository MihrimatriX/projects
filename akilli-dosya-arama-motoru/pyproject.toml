[tool.poetry]
name = "akilli-dosya-arama-motoru"
version = "0.1.0"
description = "Akıllı Dosya Arama Motoru PySide6 desktop application"
authors = ["AFU"]
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.11"
PySide6 = ">=6.11.2"
watchdog = ">=6.0.0"
rapidfuzz = ">=3.14.6"
tantivy = ">=0.26.2"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
