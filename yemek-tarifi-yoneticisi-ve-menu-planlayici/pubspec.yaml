name: yemek_tarifi_yoneticisi_ve_menu_planlayici
description: "Yemek Tarifi Yöneticisi ve Menü Planlayıcı - Flutter ile tarif arşivi, haftalık plan ve alışveriş listesi."
publish_to: 'none'
version: 1.2.0+3

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^18.0.2
  intl: ^0.20.3
  shared_preferences: ^2.2.3
  share_plus: ^13.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/launcher.json
