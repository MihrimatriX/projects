name: minimalist_podcast_uygulamasi
description: "Minimalist podcast dinleyici — kütüphane, oynatıcı, sıra ve offline indirme."
publish_to: 'none'
version: 0.3.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^18.0.2
  drift: ^2.20.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.3
  path: ^1.9.0
  intl: ^0.20.3
  shared_preferences: ^2.2.3
  url_launcher: ^6.3.0
  http: ^1.2.2
  xml: ^6.5.0
  just_audio: ^0.9.42
  file_picker: ^8.1.2
  connectivity_plus: ^7.3.2
  flutter_markdown: ^0.7.6+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.20.0
  build_runner: ^2.4.11

flutter:
  uses-material-design: true
