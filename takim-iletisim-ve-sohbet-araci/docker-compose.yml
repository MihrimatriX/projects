services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: file:/app/data/dev.db
      SESSION_SECRET: ${SESSION_SECRET:-change-me-in-production-min-32-chars-long}
      REDIS_URL: redis://redis:6379
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      UPLOAD_DIR: /app/uploads
      MAX_UPLOAD_MB: 25
    volumes:
      - appdata:/app/data
      - uploads:/app/uploads
    depends_on:
      redis:
        condition: service_healthy

volumes:
  appdata:
  uploads:
