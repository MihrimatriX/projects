<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <style>
    body { font-family: Segoe UI, sans-serif; width: 260px; padding: 12px; margin: 0; background: #1e1e2e; color: #f0f0f5; }
    h1 { font-size: 14px; margin: 0 0 8px; color: #f59e0b; }
    label { font-size: 11px; color: #a0a0b8; }
    input { width: 100%; margin: 4px 0 10px; padding: 6px; border-radius: 6px; border: 1px solid #4a4a6a; background: #2b2b3d; color: #f0f0f5; }
    button { background: #f59e0b; color: #1e1e2e; border: 0; padding: 8px 12px; border-radius: 6px; font-weight: 600; cursor: pointer; width: 100%; }
    p { font-size: 11px; color: #a0a0b8; line-height: 1.4; }
  </style>
</head>
<body>
  <h1>Ekran Zamanı Web</h1>
  <p>Aktif sekme süresini yerel uygulamaya gönderir. Ekran Zamanı açık olmalıdır.</p>
  <label for="port">Köprü portu</label>
  <input id="port" type="number" value="47123" min="1024" max="65535" />
  <button id="save">Kaydet</button>
  <p id="status" style="margin-top:8px"></p>
  <script src="popup.js"></script>
</body>
</html>
