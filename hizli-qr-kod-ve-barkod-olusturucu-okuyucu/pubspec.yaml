name: hizli_qr_kod_ve_barkod_olusturucu_okuyucu
description: "QR Kod ve Barkod Oluşturucu/Okuyucu - Flutter ile mobil ve masaüstü."
publish_to: 'none'
version: 1.3.0+4

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^18.0.2
  shared_preferences: ^2.2.3
  qr: ^3.0.2
  qr_flutter: ^4.1.0
  mobile_scanner: ^6.0.2
  image_picker: ^1.1.2
  share_plus: ^12.0.0
  url_launcher: ^6.3.0
  barcode: ^2.2.9
  barcode_widget: ^2.0.4
  archive: ^3.6.1
  file_picker: ^8.1.6
  zxing2: ^0.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/icon.png
