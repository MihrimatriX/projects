<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Ornek Web Duvar Kagidi</title>
<style>
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: radial-gradient(circle at 20% 20%, #1e3a5f, #0a0f1a 60%);
  }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let t = 0;
let paused = false;

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
document.addEventListener('pause', () => paused = true);
document.addEventListener('resume', () => paused = false);
resize();

function draw() {
  if (!paused) t += 0.016;
  const w = canvas.width, h = canvas.height;
  ctx.fillStyle = '#0a0f1a';
  ctx.fillRect(0, 0, w, h);
  for (let i = 0; i < 40; i++) {
    const x = (Math.sin(t * 0.7 + i) * 0.5 + 0.5) * w;
    const y = (Math.cos(t * 0.5 + i * 0.3) * 0.5 + 0.5) * h;
    const r = 20 + Math.sin(t + i) * 10;
    const g = ctx.createRadialGradient(x, y, 0, x, y, r * 3);
    g.addColorStop(0, `hsla(${(i * 18 + t * 40) % 360}, 80%, 60%, 0.35)`);
    g.addColorStop(1, 'transparent');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(x, y, r * 3, 0, Math.PI * 2);
    ctx.fill();
  }
  requestAnimationFrame(draw);
}
draw();
</script>
</body>
</html>
