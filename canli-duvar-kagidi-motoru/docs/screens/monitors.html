<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Monitörler — Canlı Duvar Kağıdı Motoru</title>
  <link rel="stylesheet" href="../css/tokens.css" />
  <link rel="stylesheet" href="../css/components.css" />
</head>
<body data-page="monitors">
  <div class="win-shell">
    <div data-shell="titlebar"></div>
    <div class="app-body">
      <div data-shell="sidebar"></div>
      <main class="main-content">
        <div class="page-header">
          <h1>Çoklu monitör</h1>
          <p>Her monitör için ayrı duvar kağıdı — monitör başına tek WebView2 instance</p>
        </div>
        <div class="monitor-list" id="monitor-list" aria-live="polite"></div>
        <div class="action-row">
          <button class="btn btn-primary" type="button" id="apply-monitors">Değişiklikleri uygula</button>
          <button class="btn" type="button" id="sync-monitors">Tüm monitörleri senkronize et</button>
        </div>
        <p id="monitor-feedback" class="inline-feedback" role="status" aria-live="polite"></p>
      </main>
    </div>
    <footer class="statusbar">
      <span><span class="status-dot" aria-hidden="true"></span>2 monitör algılandı</span>
      <span>WorkerW: 2 host penceresi</span>
    </footer>
  </div>
  <script src="../js/shell.js"></script>
  <script src="../js/app.js"></script>
</body>
</html>
